<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>myAdmin — Calls</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="calls.css"></head><body><main class="app calls-app"><header class="topbar page-intro"><div><p class="eyebrow">SCOUTING / APPLICATIONS / DEADLINES</p><h1>Calls <span>2026</span></h1></div><button id="newCallBtn" class="primary">+ CALL</button></header><section class="calls-summary"><article><small>DA VALUTARE</small><strong id="countScout">0</strong></article><article><small>IN PREPARAZIONE</small><strong id="countPrepare">0</strong></article><article><small>INVIATE</small><strong id="countSent">0</strong></article><article><small>PROSSIMA SCADENZA</small><strong id="nextDeadline">—</strong></article></section><section class="calls-layout"><aside class="calls-filter panel"><p class="eyebrow">WEEKLY WORKFLOW</p><h2>Pipeline</h2><button class="call-filter active" data-filter="open">Aperte</button><button class="call-filter" data-filter="scout">Da valutare</button><button class="call-filter" data-filter="prepare">In preparazione</button><button class="call-filter" data-filter="sent">Inviate</button><button class="call-filter" data-filter="all">Tutte</button><div class="calls-folder"><small>CARTELLA OPERATIVA</small><code>Desktop / Movement / Calls</code></div></aside><section class="panel calls-board"><div class="calls-board-head"><div><p class="eyebrow">DEADLINE ORDER</p><h2>Call</h2></div><span id="callCount">0</span></div><div id="callList" class="call-list"></div></section></section></main><dialog id="callDialog" class="call-dialog"><form method="dialog"><div class="call-dialog-head"><div><p class="eyebrow">CALL</p><h2 id="callDialogTitle">Nuova call</h2></div><button value="cancel" class="ghost">×</button></div><input id="callId" type="hidden"><div class="grid two"><label>Titolo<input id="callTitle" required></label><label>Ente / organizzazione<input id="callOrg"></label><label>Stato<select id="callStatus"><option value="scout">Da valutare</option><option value="prepare">In preparazione</option><option value="sent">Inviata</option><option value="discarded">Scartata</option></select></label><label>Deadline<input id="callDeadline" type="date"></label><label class="span2">Link alla call<input id="callUrl" type="url" placeholder="https://..."></label><label class="span2">PDF call — percorso / riferimento<input id="callPdf" placeholder="Desktop/Movement/Calls/.../bando.pdf"></label><label class="span2">Collega a un Movement<select id="callProject"><option value="">Nessuno</option></select></label><label class="span2">Cartella locale<input id="callFolder" placeholder="Desktop/Movement/Calls/Nome-call"></label><label class="span2">Note<textarea id="callNotes" rows="4"></textarea></label></div><p class="call-calendar-note">La deadline viene mostrata automaticamente nel Calendar.</p><div class="call-dialog-actions"><button type="button" id="deleteCallBtn" class="danger-btn">ELIMINA</button><button type="button" id="saveCallBtn" class="primary">SALVA</button></div></form></dialog><script src="nav.js"></script><script src="calls.js"></script></body></html>
