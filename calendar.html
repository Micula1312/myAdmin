<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>myAdmin — Calendar</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="projects.css"><link rel="stylesheet" href="calendar-extra.css"></head><body><main class="app projects-app calendar-app"><header class="topbar compact-topbar page-intro"><div><p class="eyebrow">TIME / TASKS / SCHEDULE</p><h1>Calendar <span>2026</span></h1></div><button id="newCalendarEvent" class="primary">+ EVENTO</button></header><section class="calendar-toolbar"><button id="prevMonth" class="ghost">←</button><div><p class="eyebrow">SCHEDULE</p><h2 id="calendarTitle"></h2></div><button id="nextMonth" class="ghost">→</button></section><section class="calendar-weekdays"><span>LUN</span><span>MAR</span><span>MER</span><span>GIO</span><span>VEN</span><span>SAB</span><span>DOM</span></section><section id="calendarGrid" class="calendar-grid"></section></main><dialog id="calendarDialog" class="project-dialog calendar-dialog"><form method="dialog"><div class="dialog-head"><div><p class="eyebrow">CALENDAR</p><h2 id="calendarDialogTitle">Nuovo evento</h2></div><button value="cancel" class="ghost">×</button></div><div class="grid two"><label class="span2">Titolo<input id="calTitle" required placeholder="Mostra, appuntamento, consegna..."></label><label>Data<input id="calDate" type="date" required></label><label>Ora<input id="calTime" type="time"></label><label>Movement<select id="calProject"><option value="">Evento indipendente</option></select></label><label>Repo / sottoprogetto<select id="calRepo"><option value="">Nessun repo specifico</option></select></label><label class="span2">Luogo / link<input id="calLocation" placeholder="Roma / Zoom / indirizzo..."></label><label class="span2">Note<textarea id="calNotes" rows="3"></textarea></label></div><p class="calendar-dialog-note">Lascia Movement vuoto per appuntamenti personali o eventi esterni. Se scegli Movement e Repo, l'evento resta collegato al lavoro senza diventare un task.</p><div class="dialog-actions"><button type="button" id="deleteCalendarEvent" class="danger-btn">ELIMINA</button><button type="button" id="saveCalendarEvent" class="primary">SALVA</button></div></form></dialog><script src="nav.js"></script><script src="calendar.js"></script></body></html>
