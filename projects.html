<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>myAdmin — Projects</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="projects.css"><style>.free-todo.is-this-week{background:#faf9f4}.free-todo.is-this-week .free-todo-copy>span{font-weight:700}.free-todo.is-other-week{opacity:.32}.free-todo-copy{min-width:0}.free-todo-copy>span{display:block;font-size:13px;line-height:1.35}.free-todo-copy small{display:block;margin-top:3px;font-size:8px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}</style></head><body><main class="app projects-app"><header class="topbar compact-topbar"><div><p class="eyebrow">MYADMIN / WORKSPACE</p><h1>Projects <span>2026</span></h1></div><div class="top-actions"><a class="ghost nav-link" href="calendar.html">CALENDARIO</a><a class="ghost nav-link" href="/">RICEVUTE</a><button id="newProjectBtn" class="primary">+ MOVEMENT</button></div></header><nav id="categoryRail" class="category-rail" aria-label="Categorie"><button class="category-dot active" data-category="all"><i></i><span>Tutti</span><b id="cat-all">0</b></button><button class="category-dot" data-category="commercial"><i></i><span>Commercial Works</span><b id="cat-commercial">0</b></button><button class="category-dot" data-category="community"><i></i><span>Community</span><b id="cat-community">0</b></button><button class="category-dot" data-category="personal"><i></i><span>Personal</span><b id="cat-personal">0</b></button></nav><section class="workspace-columns"><aside class="workspace-col projects-index-col"><div class="col-head"><div><p class="eyebrow">INDEX MOVEMENT</p><h2>Movements</h2></div><div class="col-head-actions"><span id="projectCount">0</span><button id="addProjectQuick" class="col-plus">+</button></div></div><div id="projectIndex" class="project-index scroll-stack"></div></aside><section class="workspace-col repos-col"><div class="col-head"><div><p class="eyebrow" id="repoScopeLabel">REPOSITORIES</p><h2>Repo / sottoprogetti</h2></div><div class="col-head-actions"><span id="visibleRepoCount">0</span><button id="addRepoQuick" class="col-plus">+</button></div></div><div id="workspaceRepos" class="repo-stack scroll-stack"></div></section><section class="workspace-col todo-col"><div class="col-head"><div><p class="eyebrow">TO DO</p><h2>Questa settimana</h2></div><div class="col-head-actions"><span id="todoHours"></span><span id="todoCount">0</span></div></div><form id="todoComposer" class="todo-composer simple"><input id="todoText" placeholder="Scrivi una cosa da fare…" autocomplete="off"><select id="todoRepo"><option value="">Scegli repo…</option></select><button class="primary" type="submit">+</button></form><div id="todoList" class="todo-list free-todo-list scroll-stack"></div></section></section></main><div hidden><span id="repoCount">0</span><span id="openTasks">0</span><div id="nextActions"></div><div id="repoIndex"></div></div><dialog id="projectDialog" class="project-dialog"><form method="dialog" id="projectForm"><div class="dialog-head"><div><p class="eyebrow">MOVEMENT</p><h2 id="dialogTitle">Nuovo movement</h2></div><button value="cancel" class="ghost">×</button></div><input id="projectId" type="hidden"><div class="grid two"><label>Nome<input id="projectName" required></label><label>Cliente / organizzazione<input id="projectClient"></label><label>Stato<select id="projectStatus"><option value="active">Attivo</option><option value="intermittent">Intermittente</option><option value="paused">In pausa</option><option value="idea">Da attivare</option><option value="done">Chiuso</option></select></label><label>Categoria<select id="projectCategory"><option value="commercial">Commercial Works</option><option value="community">Community</option><option value="personal">Personal</option></select></label><label>Valore / budget (€)<input id="projectBudget"></label><label>Deadline<input id="projectDeadline" type="date"></label><label class="span2">Prossima azione<input id="projectNextAction"></label><label class="span2">Note<textarea id="projectNotes" rows="3"></textarea></label></div><h3>Repository</h3><div id="subprojectEditor" class="subproject-editor"></div><button type="button" id="addSubprojectBtn" class="ghost">+ AGGIUNGI REPO</button><section id="projectTimeline" class="project-timeline"></section><div class="dialog-actions"><button type="button" id="deleteProjectBtn" class="danger-btn">ELIMINA</button><button type="button" id="saveProjectBtn" class="primary">SALVA</button></div></form></dialog><dialog id="repoDialog" class="project-dialog repo-dialog"><form method="dialog"><div class="dialog-head"><div><p class="eyebrow">REPOSITORY</p><h2 id="repoDialogTitle">Repo</h2></div><button value="cancel" class="ghost">×</button></div><div id="repoDialogMeta" class="repo-dialog-meta"></div><div id="repoTaskList" class="repo-task-list"></div></form></dialog><dialog id="quickRepoDialog" class="quick-dialog"><form method="dialog"><div class="dialog-head"><div><p class="eyebrow">NEW REPOSITORY</p><h2>Nuovo repo</h2></div><button value="cancel" class="ghost">×</button></div><label>Movement<select id="quickRepoProject"></select></label><label>Nome repo<input id="quickRepoName"></label><div class="dialog-actions"><span></span><button type="button" id="quickRepoSave" class="primary">CREA REPO</button></div></form></dialog><script src="projects.js"></script><script src="task-details.js"></script><script src="repo-inline.js"></script><script src="planning.js"></script></body></html>
